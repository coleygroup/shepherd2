constants:
  atom_types: [null, H, C, N, O, F, Cl, Br, I, S, P, Si, Dummy]
  charge_types: [0, 1, 2, -1, -2]
  diffuse_formal_charges: true
  bond_types: [null, SINGLE, DOUBLE, TRIPLE, AROMATIC]
  diffuse_bonds: true
  num_pharmacophore_types: 10
data: MOSES_aq_HDF5
data_dir: null
compile_encoder: true
compile_joint_processing: false
compile_denoisers: false
compile_property_embedding: false
edm:
  use_edm: true
  sigma_data_pos: 3.0
  sigma_data_esp: 0.46
  sigma_data_atom_one_hot: 0.3
  sigma_data_pharm_one_hot: 0.27
  sigma_data_bond: 0.43
  scale_by_sigma_data: false
  sigma_max: 2.0
use_ema: false
x1_bond_diffusion: ${constants.diffuse_bonds}
x1_formal_charge_diffusion: ${constants.diffuse_formal_charges}
explicit_diffusion_variables: [x1, x3, x4]
scaffold_conditioning: true
exclude_variables_from_decoder_heterogeneous_graph: []
training:
  train_x1_denoising: true
  train_x2_denoising: false
  train_x3_denoising: true
  train_x4_denoising: true
  batch_size: 24
  accumulate_grad_batches: 2
  num_gpus: 2
  lr: 0.001
  min_lr: 0.0003
  lr_steps: 100000
  warmup_steps: 10000
  gradient_clip_val: 5.0
  num_workers: 6
  output_dir: shepherd2-moses/
  wandb_project: null
  wandb_name: shepherd2-moses
  log_every_n_steps: 50
  multiprocessing_spawn: false
  prefetch_factor: 2
  persistent_workers: true
  val_check_interval: 0.125
  save_checkpoint_every_epoch: false
  ema:
    enabled: true
    stds: [0.05, 0.1]
    checkpoint_every_n_steps: 10000
    use_for_validation: false
    validation_index: 1
  validation_conditional: false
dataset:
  explicit_hydrogens: true
  probe_radius: 0.6
  compute_x1: true
  compute_x2: false
  compute_x3: true
  compute_x4: true
  scale_point_cloud: 1.0
  x1:
    recenter: true
    add_virtual_node: true
    remove_noise_COM: true
    atom_types: ${constants.atom_types}
    charge_types: ${constants.charge_types}
    bond_types: ${constants.bond_types}
    scale_atom_features: 0.25
    scale_bond_features: 1.0
    include_dummy_atoms: true
    fixed_substructure:
      prob_fixed_substructure: 0.5
      prob_random_vs_subgraphs: 0.5
      frac_random: 0.1
      hydrogen_weight: 0.3
      num_fracs: 4
      upper_bound_fraction_options: [0.1, 0.2, 0.3]
      prob_use_scaffold_com: 0.5
  x2:
    recenter: false
    add_virtual_node: true
    remove_noise_COM: false
    num_points: 75
    independent_timesteps: false
  x3:
    independent_timesteps: false
    recenter: false
    add_virtual_node: true
    remove_noise_COM: false
    num_points: 75
    scale_node_features: 1.0
  x4:
    independent_timesteps: false
    recenter: false
    add_virtual_node: true
    remove_noise_COM: false
    max_node_types: null
    scale_node_features: 1.0
    scale_vector_features: 1.0
    multivectors: false
    check_accessibility: false
    include_dummy_pharm: true
    fixed_substructure:
      prob_fixed_pharmacophore: 0.667
feedforward_network:
  grid_resolution_list: [4, 4]
  use_grid_mlp: true
  activation: sep-merge_gates2_swiglu
  dropout: 0.0
  num_hidden_channels: 32
decoder_heterogeneous_graph_encoder:
  use: true
  num_layers: 2
  input_sphere_channels: 64
  attn_hidden_channels: 24
  num_heads: 2
  attn_alpha_channels: 24
  attn_value_channels: 24
  ffn_hidden_channels: 32
  cutoff: 5.0
  max_neighbors: 2048
  edge_channels: 128
  l0_res_conditioning: false
  attn_activation: sep-merge_gates2_swiglu
  use_add_merge: false
  use_grid_mlp: true
  attn_mask_rate: 0.0
  attn_weights_drop: 0.0
  value_drop: 0.0
  proj_drop: 0.0
  ffn_drop: 0.0
  lmax: 1
  mmax: 1
  num_channels: 64
  attn_grid_resolution_list: [4, 4]
  ffn_grid_resolution_list: [4, 4]
  drop_path_rate: 0.0
  alpha_drop: 0.0
x1:
  decoder:
    input_node_channels: null
    node_channels: 64
    time_embedding_size: 32
    force_edges_to_virtual_nodes: true
    encoder:
      fully_connected: true
      num_layers: 4
      input_sphere_channels: 64
      input_bond_channels: null
      attn_hidden_channels: 32
      num_heads: 4
      attn_alpha_channels: 32
      attn_value_channels: 32
      ffn_hidden_channels: 64
      cutoff: 5.0
      max_neighbors: 2048
      edge_channels: 128
      attn_activation: sep-merge_gates2_swiglu
      use_add_merge: false
      use_grid_mlp: true
      attn_mask_rate: 0.0
      attn_weights_drop: 0.0
      value_drop: 0.0
      proj_drop: 0.0
      ffn_drop: 0.0
      l0_res_conditioning: false
      lmax: 1
      mmax: 1
      num_channels: 64
      attn_grid_resolution_list: [4, 4]
      ffn_grid_resolution_list: [4, 4]
      drop_path_rate: 0.0
      alpha_drop: 0.0
      edge_attr_input_channels: 64
    denoiser:
      output_node_channels: null
      output_bond_channels: null
      MLP_hidden_dim: 64
      num_MLP_hidden_layers: 2
      use_e3nn: true
      e3nn:
        num_hidden_channels: 32
        lmax: 1
        mmax: 1
      use_egnn_positions_update: true
      egnn:
        normalize_egnn_vectors: true
        distance_expansion_dim: 32
        num_MLP_hidden_layers: 2
        MLP_hidden_dim: 64
x2:
  decoder:
    input_node_channels: 2
    node_channels: 64
    time_embedding_size: 32
    force_edges_to_virtual_nodes: true
    encoder:
      num_layers: 2
      input_sphere_channels: 64
      attn_hidden_channels: 24
      num_heads: 2
      attn_alpha_channels: 24
      attn_value_channels: 24
      ffn_hidden_channels: 32
      cutoff: 5.0
      max_neighbors: 2048
      edge_channels: 128
      attn_activation: sep-merge_gates2_swiglu
      use_add_merge: false
      use_grid_mlp: true
      attn_mask_rate: 0.0
      attn_weights_drop: 0.0
      value_drop: 0.0
      proj_drop: 0.0
      ffn_drop: 0.0
      l0_res_conditioning: false
      lmax: 1
      mmax: 1
      num_channels: 64
      attn_grid_resolution_list: [4, 4]
      ffn_grid_resolution_list: [4, 4]
      drop_path_rate: 0.0
      alpha_drop: 0.0
    denoiser:
      output_node_channels: 64
      use_e3nn: true
      e3nn:
        num_hidden_channels: 32
        lmax: 1
        mmax: 1
      use_egnn_positions_update: false
      egnn:
        normalize_egnn_vectors: true
        distance_expansion_dim: 32
        num_MLP_hidden_layers: 2
        MLP_hidden_dim: 64
x3:
  decoder:
    scalar_expansion_min: -10.0
    scalar_expansion_max: 10.0
    input_node_channels: 64
    node_channels: 64
    time_embedding_size: 32
    force_edges_to_virtual_nodes: true
    encoder:
      num_layers: 2
      input_sphere_channels: 64
      attn_hidden_channels: 24
      num_heads: 2
      attn_alpha_channels: 24
      attn_value_channels: 24
      ffn_hidden_channels: 32
      cutoff: 5.0
      max_neighbors: 2048
      edge_channels: 128
      attn_activation: sep-merge_gates2_swiglu
      use_add_merge: false
      use_grid_mlp: true
      attn_mask_rate: 0.0
      attn_weights_drop: 0.0
      value_drop: 0.0
      proj_drop: 0.0
      ffn_drop: 0.0
      l0_res_conditioning: false
      lmax: 1
      mmax: 1
      num_channels: 64
      attn_grid_resolution_list: [4, 4]
      ffn_grid_resolution_list: [4, 4]
      drop_path_rate: 0.0
      alpha_drop: 0.0
    denoiser:
      output_node_channels: 1
      MLP_hidden_dim: 64
      num_MLP_hidden_layers: 2
      use_e3nn: true
      e3nn:
        num_hidden_channels: 32
        lmax: 1
        mmax: 1
      use_egnn_positions_update: false
      egnn:
        normalize_egnn_vectors: true
        distance_expansion_dim: 32
        num_MLP_hidden_layers: 2
        MLP_hidden_dim: 64
x4:
  decoder:
    input_node_channels: null
    node_channels: 64
    time_embedding_size: 32
    force_edges_to_virtual_nodes: true
    encoder:
      num_layers: 2
      input_sphere_channels: 64
      attn_hidden_channels: 24
      num_heads: 2
      attn_alpha_channels: 24
      attn_value_channels: 24
      ffn_hidden_channels: 32
      cutoff: 5.0
      max_neighbors: 2048
      edge_channels: 128
      attn_activation: sep-merge_gates2_swiglu
      use_add_merge: false
      use_grid_mlp: true
      attn_mask_rate: 0.0
      attn_weights_drop: 0.0
      value_drop: 0.0
      proj_drop: 0.0
      ffn_drop: 0.0
      l0_res_conditioning: false
      lmax: 1
      mmax: 1
      num_channels: 64
      attn_grid_resolution_list: [4, 4]
      ffn_grid_resolution_list: [4, 4]
      drop_path_rate: 0.0
      alpha_drop: 0.0
    denoiser:
      output_node_channels: null
      MLP_hidden_dim: 64
      num_MLP_hidden_layers: 2
      use_e3nn: true
      e3nn:
        num_hidden_channels: 32
        lmax: 1
        mmax: 1
      use_egnn_positions_update: false
      egnn:
        normalize_egnn_vectors: true
        distance_expansion_dim: 32
        num_MLP_hidden_layers: 2
        MLP_hidden_dim: 64
lmax: 1
mmax: 1
